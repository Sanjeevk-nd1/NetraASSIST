version: "3.8"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netraassist
      POSTGRES_USER: netraassist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netraassist"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flask/Gunicorn (API + Frontend) ─────────────────────────────────
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3002}:${PORT:-3002}"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://netraassist:${POSTGRES_PASSWORD:-changeme}@db:5432/netraassist
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/backend/uploads
      - downloads:/app/backend/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Worker ───────────────────────────────────────────────────
  celery:
    build: .
    restart: unless-stopped
    command: >
      celery -A backend.celery_app worker
      --queues=batch
      --concurrency=${DOC_PROCESS_MAX_WORKERS:-2}
      --loglevel=info
      --without-heartbeat
      --without-mingle
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://netraassist:${POSTGRES_PASSWORD:-changeme}@db:5432/netraassist
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/backend/uploads
      - downloads:/app/backend/downloads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
  downloads:
