# ─────────────────────────────────────────────────────────────────────
# Apache hardening for the NetraASSIST front-door reverse proxy
# (10.100.9.244 in the VAPT report — finding #3 "Unused or
# Misconfigured Web Service Exposure").
#
# Apply on the host running Apache 2.4.x:
#   sudo cp deploy/apache-hardening.conf /etc/apache2/conf-available/netraassist-hardening.conf
#   sudo a2enconf netraassist-hardening
#   sudo a2dissite 000-default     # remove the stock "It works!" page
#   sudo systemctl reload apache2
#
# Verify after reload:
#   curl -sI https://netrassist.netradyne.info | grep -iE 'server|x-powered-by'
#       Server: NetraASSIST
#   curl -s  https://netrassist.netradyne.info/this-does-not-exist
#       (custom 404 — no Apache version, no OS, no module list)
#   curl -s  https://netrassist.netradyne.info/robots.txt
#       (custom file — no signature footer)
# ─────────────────────────────────────────────────────────────────────

# 1. Strip the version + OS + module list from `Server:` and from error pages.
ServerTokens Prod
ServerSignature Off

# 2. Override the Server header entirely (requires mod_headers).
#    `ServerTokens Prod` still emits "Apache". Setting it explicitly hides
#    even that.
<IfModule mod_headers.c>
    Header unset Server
    Header always set Server "NetraASSIST"
    Header unset X-Powered-By
    Header unset X-AspNet-Version
    Header unset X-AspNetMvc-Version
    Header unset Via

    # Security baseline (mirrors what the Flask app sets — belt and braces
    # in case the proxy is hit directly).
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Strict-Transport-Security "max-age=63072000; includeSubDomains"
    Header always set Permissions-Policy "accelerometer=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always set Cross-Origin-Opener-Policy "same-origin"
</IfModule>

# 3. Disable directory listings + the welcome page that exposed /var/www.
<Directory />
    Options -Indexes -FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

# 4. Custom error documents — never leak Apache version, file path, or
#    module name in 4xx/5xx responses.
ErrorDocument 400 "Bad Request"
ErrorDocument 401 "Unauthorized"
ErrorDocument 403 "Forbidden"
ErrorDocument 404 "Not Found"
ErrorDocument 405 "Method Not Allowed"
ErrorDocument 500 "Internal Server Error"
ErrorDocument 502 "Bad Gateway"
ErrorDocument 503 "Service Unavailable"

# 5. Disable trace/options method probing (CVE-2003-1567 / OWASP).
TraceEnable off
<Limit OPTIONS TRACE TRACK>
    Require all denied
</Limit>

# 6. Disable unused modules (run once on the host):
#    sudo a2dismod status autoindex info userdir negotiation cgi
#    (Keep: ssl, rewrite, headers, proxy_http, proxy.)

# 7. Block direct access to default test files in case the package
#    re-installs them.
<FilesMatch "^(index\.html|index\.html\.\w+)$">
    <If "%{REQUEST_URI} =~ m#^/(index\.html)?$# && -f '/var/www/html/index.html'">
        Require all denied
    </If>
</FilesMatch>

# 8. Remove the stock Debian/Ubuntu test page if it's still on disk:
#    sudo rm -f /var/www/html/index.html
#    sudo rm -f /var/www/html/apache2-default
